[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-public-money"
dynamic = ["version"]
description = "MCP server for Slovak public-money registers (CRZ contracts, RPVS beneficial owners, RPO legal entities, RÚZ financial statements, public procurement)"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pypdf>=5",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sk-public-money-mcp = "sk_public_money.server:main"
sk-public-money-sync = "sk_public_money.sync:main"
# Kept for existing setups; the same as sk-public-money-sync uvo.
sk-public-money-uvo-sync = "sk_public_money.sources.uvo.sync:main"

[tool.hatch.version]
path = "src/sk_public_money/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
