[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-public-money"
dynamic = ["version"]
description = "MCP server for Slovak public-money registers (CRZ contracts, RPVS beneficial owners, RPO legal entities, RÚZ financial statements)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
sk-public-money-mcp = "sk_public_money.server:main"

[tool.hatch.version]
path = "src/sk_public_money/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
